[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gunsight"
version = "0.1.0"
description = "Robust, scale-invariant GUI target locator using SIFT and Homography"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Section 9 Intelligence Architecture" }
]
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "click>=8.0.0"
]

[project.scripts]
gunsight = "gunsight:main"
